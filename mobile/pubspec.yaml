name: earmark
description: "Earmark: your pendant, your notes, private."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.6.0        # Bluetooth LE (BSD-3, Philips Hue)
  flutter_secure_storage: ^11.2.0     # device token in Keychain / Keystore
  path_provider: ^2.1.6
  http: ^1.6.0
  flutter_foreground_task: ^11.0.3    # Android: keep recording with the screen off
  permission_handler: ^13.0.2
  intl: ^0.20.3
  earmark_asr:                        # on-device speech to text (iOS: Parakeet via FluidAudio)
    path: packages/earmark_asr
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/OMI_LICENSE.txt
    - assets/fonts/OFL-Geist.txt
    - assets/fonts/OFL-Newsreader.txt
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader_400Regular.ttf
        - asset: assets/fonts/Newsreader_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader_400Regular_Italic.ttf
          style: italic
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist_400Regular.ttf
        - asset: assets/fonts/Geist_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist_600SemiBold.ttf
          weight: 600
