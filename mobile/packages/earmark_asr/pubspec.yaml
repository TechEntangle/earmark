name: earmark_asr
description: "On-device speech to text for Earmark (iOS: Parakeet via FluidAudio on the Neural Engine)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: EarmarkAsrPlugin
